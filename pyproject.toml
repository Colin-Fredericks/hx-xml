[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hx-xml"
version = "0.0.0"
description = "HarvardX XML tools for dealing with edX courses"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "lxml==5.2.2",
    "tinycss2==1.3.0",
    "beautifulsoup4==4.9.3",
    "chardet==5.2.0",
    "markdownify==0.9.3",
]

[project.optional-dependencies]
dev = [
    "pytest==6.2.5",
    "flake8==3.9.2",
]

[tool.setuptools]
packages = []
py-modules = []